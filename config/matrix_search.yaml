experiment:
  name: "blackwell-sweep-tier1-optimized"
  description: "hyperparameters inference test"
  seed: 42

models:

  - id: "google/gemma-4-31B-it-qat-w4a16-ct"
    backend: "vllm"
    description: "Extreme 4-bit quantized variant - captures efficiency floor"
    max_seq_length: 4096

dataset:
  source: "hf"
  path: "maritaca-ai/enem"
  split: "train"
  max_samples: 10
  schema_fallback_keys:
    question: ["question", "text", "input", "prompt"]
    answer: ["answer", "label", "output", "target", "alternatives"]

hyperparameters:
  quantization:
    - null
  cache_config:
    - name: "baseline"
      kv_cache: false
      prefix_cache: false
      description: "No caching (reference point)"

    - name: "kv_only"
      kv_cache: true
      prefix_cache: false
      description: "KV cache for memory efficiency"

  max_new_tokens: 256

# temperature drives sampling directly (temperature=0.0 means greedy/no sampling);
# there is no separate do_sample switch.
generation:
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.0

hardware:
  monitor_interval_ms: 50
  gpu_device_index: 0
  tdp_limit_watts: 300

# Output is always written as Parquet with full telemetry; there is no
# selective-sampling or alternate-format mode (yet) to configure.
output:
  results_dir: "results/tier1"
  compress: "snappy"

mock:
  enabled: false
  simulate_oom_probability: 0.0
  base_latency_ms: 10
  tokens_per_second: 80

# Note: execution is always sequential, one subprocess per cell, with a
# hardcoded 3600s timeout and OOM/error-skip-and-continue policy (see
# src/orchestrator.py). There is currently no config surface for concurrency,
# custom timeouts, or retry tuning — those would need to be implemented
# before adding an `execution:` block back here.
#
# Post-hoc analysis/comparison tables are not generated by the sweep itself;
# use extract_results.py against the output Parquet file instead.
